[package]
name = "referrail"
version = "0.1.0"
edition = "2021"
description = "ReferRail NEAR — referral escrow and split contract (NEP-141)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "s"
lto = true
debug = false
panic = "abort"
overflow-checks = true
